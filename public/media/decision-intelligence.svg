<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" fill="none">
<rect width="1400" height="900" rx="48" fill="#F5F8FB"/><rect x="80" y="70" width="1240" height="760" rx="34" fill="white" stroke="#DCE5EE"/>
<text x="130" y="145" fill="#0F172A" font-family="Arial" font-size="34" font-weight="700">Decision Intelligence Cockpit</text><text x="130" y="185" fill="#667085" font-family="Arial" font-size="19">One challenge, four questions the system must answer before public resources move.</text>
<g font-family="Arial"><g><rect x="130" y="255" width="520" height="190" rx="24" fill="#F0FBF8" stroke="#BCE7DE"/><circle cx="185" cy="315" r="26" fill="#0F8A78"/><text x="176" y="324" fill="white" font-size="24" font-weight="700">1</text><text x="225" y="305" fill="#0F172A" font-size="24" font-weight="700">Has this been solved before?</text><text x="225" y="339" fill="#667085" font-size="16">Search Innovation Memory and related problem families.</text><rect x="225" y="370" width="250" height="42" rx="12" fill="#0F8A78"/><text x="247" y="397" fill="white" font-size="16" font-weight="700">Related evidence found</text></g>
<g><rect x="750" y="255" width="520" height="190" rx="24" fill="#F4F7FF" stroke="#D7E0FF"/><circle cx="805" cy="315" r="26" fill="#4263EB"/><text x="796" y="324" fill="white" font-size="24" font-weight="700">2</text><text x="845" y="305" fill="#0F172A" font-size="24" font-weight="700">Will it work here?</text><text x="845" y="339" fill="#667085" font-size="16">Compare geography, capacity, maintenance and beneficiary context.</text><rect x="845" y="370" width="210" height="42" rx="12" fill="#4263EB"/><text x="874" y="397" fill="white" font-size="16" font-weight="700">ADAPT · 72%</text></g>
<g><rect x="130" y="500" width="520" height="190" rx="24" fill="#FFF8F1" stroke="#F5D9B8"/><circle cx="185" cy="560" r="26" fill="#C87521"/><text x="176" y="569" fill="white" font-size="24" font-weight="700">3</text><text x="225" y="550" fill="#0F172A" font-size="24" font-weight="700">Why could it fail?</text><text x="225" y="584" fill="#667085" font-size="16">Pre-mortem, failure patterns and mitigation before approval.</text><rect x="225" y="615" width="250" height="42" rx="12" fill="#C87521"/><text x="251" y="642" fill="white" font-size="16" font-weight="700">4 risks to address</text></g>
<g><rect x="750" y="500" width="520" height="190" rx="24" fill="#FAF5FF" stroke="#E8D6F6"/><circle cx="805" cy="560" r="26" fill="#8B5CF6"/><text x="796" y="569" fill="white" font-size="24" font-weight="700">4</text><text x="845" y="550" fill="#0F172A" font-size="24" font-weight="700">Did it actually work?</text><text x="845" y="584" fill="#667085" font-size="16">Baseline + post data + community + government evidence.</text><rect x="845" y="615" width="230" height="42" rx="12" fill="#8B5CF6"/><text x="871" y="642" fill="white" font-size="16" font-weight="700">Impact integrity</text></g></g>
</svg>
