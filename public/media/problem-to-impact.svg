  <text x="142" y="168" fill="#062D20" font-family="Arial, sans-serif" font-size="36" font-weight="700">From a local challenge to measurable change</text>
  <text x="142" y="210" fill="#667B6F" font-family="Arial, sans-serif" font-size="19">One continuous decision trail keeps evidence, collaboration and outcomes connected.</text>

