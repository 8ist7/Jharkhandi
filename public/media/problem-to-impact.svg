  <text x="232" y="626" fill="#123B2B" font-family="Arial, sans-serif" font-size="25" font-weight="700">Every outcome becomes reusable evidence for the next challenge.</text>
  <text x="232" y="663" fill="#6C8175" font-family="Arial, sans-serif" font-size="17">Successful, partial and failed projects stay connected to context, risks, adaptations and verified impact.</text>
